# Ambiente prod-like opcional: Postgres + MinIO (S3 compatível)
# Não é necessário para desenvolvimento local — sem DATABASE_URL a API usa PGlite.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blujay
      POSTGRES_PASSWORD: blujay
      POSTGRES_DB: blujay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blujay"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: blujay
      MINIO_ROOT_PASSWORD: blujay-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Cria o bucket de documentos no MinIO (idempotente)
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 blujay blujay-dev-only &&
      mc mb -p local/blujay-documents || true
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://blujay:blujay@postgres:5432/blujay
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET no ambiente}
      CORS_ORIGIN: http://localhost:8080
      WEB_BASE_URL: http://localhost:8080
      COOKIE_SECURE: "false"
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-west-1
      S3_BUCKET: blujay-documents
      S3_ACCESS_KEY_ID: blujay
      S3_SECRET_ACCESS_KEY: blujay-dev-only
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
