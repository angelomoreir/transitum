# Ambiente prod-like opcional: Postgres + MinIO (S3 compatível)
# Não é necessário para desenvolvimento local — sem DATABASE_URL a API usa PGlite.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blujay
      POSTGRES_PASSWORD: blujay
      POSTGRES_DB: blujay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blujay"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: blujay
      MINIO_ROOT_PASSWORD: blujay-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
