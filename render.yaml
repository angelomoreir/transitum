# Transitum — Blueprint Render (demo pública)
#
# Pré-requisitos:
#   1. Push do repo para GitHub/GitLab
#   2. Projeto Neon criado (região Frankfurt recomendada) — copiar a
#      connection string POOLED (host com "-pooler", com ?sslmode=require)
#   3. New → Blueprint → apontar a este repo
#
# No deploy, o Render pede os valores marcados `sync: false`:
#   - DATABASE_URL (Neon) — na transitum-api
#   - PLATFORM_ADMIN_EMAILS — o teu email (acesso a /admin)
#
# Depois do deploy: correr o seed uma vez contra a Neon
#   SEED_DEMO=1 DATABASE_URL=<neon> npm run db:seed -w @transitum/api

services:
  # ── API (Fastify + Drizzle) ────────────────────────────────────────────────
  - type: web
    name: transitum-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm run start -w @transitum/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # ← colar a connection string pooled da Neon
      - key: JWT_SECRET
        generateValue: true
      - key: SECRETS_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # URL pública do frontend — necessária para cookies/CORS e links de email.
      # (static sites não suportam hostUrl — ajusta se mudares o nome do serviço)
      - key: CORS_ORIGIN
        value: https://transitum-web.onrender.com
      - key: WEB_BASE_URL
        value: https://transitum-web.onrender.com
      - key: DEMO_MODE
        value: "true" # protege as contas *@transitum.local de mudanças de password/MFA/suspensão
      - key: PLATFORM_ADMIN_EMAILS
        sync: false # ← o teu email
      - key: MAIL_FROM
        value: Transitum <no-reply@transitum.local>

  # ── Frontend (Vite build → static site) ────────────────────────────────────
  - type: web
    name: transitum-web
    runtime: static
    buildCommand: npm install && npm run build -w @transitum/web
    staticPublishPath: apps/web/dist
    routes:
      # Proxy da API — mantém o cookie de refresh same-site
      - type: rewrite
        source: /api/*
        destination: https://transitum-api.onrender.com/api/*
      - type: rewrite
        source: /docs
        destination: https://transitum-api.onrender.com/docs
      - type: rewrite
        source: /docs/*
        destination: https://transitum-api.onrender.com/docs/*
      # SPA fallback
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_DEMO
        value: "1" # mostra a caixa de credenciais demo no login

# Reset manual dos dados demo (cron exige plano pago no Render):
#   SEED_DEMO=1 SEED_RESET=1 DATABASE_URL=<neon> npm run db:seed -w @transitum/api
